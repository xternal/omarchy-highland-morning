# Highland Morning: Pavel's light theme for sunny days, the daytime partner
# to Brown Study. Scottish Highlands in the morning: a sage-and-lichen
# background, pine-needle ink for text, pine green for the chrome, with
# heather, rowan berry, bracken, gorse, loch water and peat for the colours.
# Same contrast rules as Brown Study: body text 12.5:1 on the background
# (never above 14:1, so it doesn't glare), every coloured text tone clears
# 7:1 (WCAG AAA), bright tones and muted text clear 6:1. Background deepened
# on 24 Nov 2026 from #eceee4, which felt too pale.
mode = "light"

accent = "#1f5238"
selection = "#bdd2b2"
selection_foreground = "#152019"
muted = "#4a564e"

background = "#dfe6d3"
dark_background = "#d7dfca"
